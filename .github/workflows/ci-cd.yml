name: SSE3D CI/CD Pipeline

# Block parallel executions of older commits on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # JOB 1: Validate Frontend (Next.js)
  # ==========================================
  ci-frontend:
    name: 🎨 Validate Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Run Linter
        run: npm run lint

      - name: Test Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://sse3d-api.fly.dev"
          PYTHON_API_URL: "https://sse3d-api.fly.dev"
          NEXT_PUBLIC_TEXTURE_CDN_URL: "https://d31jkr7a4h5bp3.cloudfront.net"

  # ==========================================
  # JOB 2: Validate Backend (FastAPI / Python)
  # ==========================================
  ci-backend:
    name: ⚙️ Validate FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sse3d-api
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './sse3d-api/requirements.txt'

      - name: Install dependencies (Python)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Run Code Linter (Ruff)
        run: ruff check .

      - name: Run Tests (Pytest)
        run: pytest tests/ -v
        env:
          API_NASA_KEY: "DEMO_KEY"
          BFF_JWT_SECRET: "test-secret"
          NEXTAUTH_SECRET: "test-secret"
          UPSTASH_REDIS_REST_URL: "http://localhost"
          UPSTASH_REDIS_REST_TOKEN: "fake-token"

  # ==========================================
  # JOB 3: Continuous Deployment (Fly.io)
  # ==========================================
  cd-backend:
    name: 🚀 Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-backend] 
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    defaults:
      run:
        working-directory: ./sse3d-api

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy API
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
