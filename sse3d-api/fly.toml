app = "sse3d-api"
primary_region = "gru"

[env]
  ALLOWED_ORIGINS = "http://localhost:3000,https://sse3d.vercel.app"
  SPICE_KERNEL_DIR = "/data/kernels"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  # Warm/pre-provisioned volume policy. Test hydration separately before raising to 1200s.
  grace_period = "180s"
  interval = "15s"
  method = "get"
  path = "/ready"
  timeout = "5s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "spice_data"
  destination = "/data"